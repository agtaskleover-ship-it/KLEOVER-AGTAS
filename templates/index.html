
<!DOCTYPE html>
<html>
<head>
    <title>Student API Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f9;
        }

        h1, h2 {
            color: #183153;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 16px;
            background: #1877d2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #105da8;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #result, #greeting {
            margin-top: 20px;
            padding: 12px;
            background: #eef5ff;
            border-radius: 5px;
        }
    </style>
</head>
    
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
        background-color: #f4f4f4;
    }

    button {
        padding: 8px 14px;
        margin: 5px;
        cursor: pointer;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
    }

    button:hover {
        background-color: #0056b3;
    }

    input {
        padding: 8px;
        border: 1px solid #cccccc;
        border-radius: 4px;
    }

    #result {
        margin-top: 20px;
        padding: 10px;
        border: 1px solid #cccccc;
        background-color: white;
        border-radius: 5px;
    }

    #greeting {
        margin-top: 15px;
        font-weight: bold;
        color: green;
    }
</style>


<body>

    <h1>Student API Interface</h1>
    <p>Welcome to my Flask API Web Application!</p>

    <div class="container">
        <h2>Student Information</h2>

        <button onclick="loadStudent()">
            Load Student Information
        </button>

        <div id="result"></div>
    </div>

    <div class="container">
        <h2>Greeting API</h2>

        <input type="text" id="nameInput"
        placeholder="Enter your first name">

        <button onclick="sayHello()">
            Say Hello
        </button>

        <p id="greeting"></p>
    </div>

    <script>

        function loadStudent() {
            fetch('/student')
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').innerHTML =
                    '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                    '<p><b>Name:</b> ' + data.name + '</p>' +
                    '<p><b>Program:</b> ' + data.program + '</p>' +
                    '<p><b>Year:</b> ' + data.year + '</p>' +
                    '<p><b>Section:</b> ' + data.section + '</p>';
            })
            .catch(error => {
                document.getElementById('result').innerText =
                    'Unable to retrieve data.';
            });
        }

        function sayHello() {
            const name = document.getElementById('nameInput').value;

            fetch('/hello?name=' + encodeURIComponent(name))
            .then(response => response.json())
            .then(data => {
                document.getElementById('greeting').innerText =
                    data.message;
            })
            .catch(error => {
                document.getElementById('greeting').innerText =
                    'Unable to retrieve greeting.';
            });
        }

    </script>

</body>
</html>
